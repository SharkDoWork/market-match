app:
  profile: "go-2"
  name: "match-engine" # ENV APP_NAME
  seq: 0  # ENV CAPTAIN_SEQ

rabbitmq:
  address:
    - "192.168.10.45:5672"
  virtual-host: "/"
  username: "admin"
  password: "QGgRlqdMXdGu"
  conn-num: 10
  conn-timeout-ms: 3000
  n-retry: 30
  ts-bumper-interval-ms: 3000
  exchange:
    market: "ts-bumper"
    #market: "market.quotation"
    trade-detail: "exchange.matchresults"
    quotation: "l2quote"
  max-delay-s: 60
  compressed: false

batch_result: 90

snapshot:
  dir: "./sp/"
  ends-with: "-snapshot-go"
  n-history: 10
  min-gap: 100000

scheduler:
  snapshot: [0, 60000]  #15分钟
  orderbook-report: [0, 1500000]

redis:
  address:
    - "192.168.10.37:7002"
    - "192.168.10.37:7000"
    - "192.168.10.37:7001"
    - "192.168.10.37:7003"
    - "192.168.10.37:7004"
    - "192.168.10.37:7005"
  password: ""
  db: "0"
log:
  debug: false
  json-encode: false
  info-path: "./log/info.log"
  error-path: "./log/warn.log"
  max-age: 168
  Rotation: 1
  level: info # support trace debug info warn

exchange:
  l2quote:
    size: 1800
  trade:
    size: 5000
  depth:
    size: 1000

mrredis:
  check-result: true

symbols:
  - ETH_USDT
  - BTC_USDT

market:
  freq-depth-update-interval-ms: 30
  min-depth-update-interval-ms: 100
  min-stacked-depth-update-interval-ms: 1000
  default-update-interval-ms: 1000

symbol-info:
  default:
    amount-scale: 18
    price-scale: 18
    l2quote-price-scale: 2
    depth-10percent-capacity: 200
    depth-steps:
      "0": [0.000000000000000001, 150]
      "1": [0.00001, 150]
      "2": [0.0001, 150]
      "3": [0.001, 150]
      "4": [0.01, 150]
      "5": [0.1, 150]
      "6": [0.000000000000000001, 20]
      "7": [0.00001, 20]
      "8": [0.0001, 20]
      "9": [0.001, 20]
      "10": [0.01, 20]
      "11": [0.1, 20]
    uncombined-depth-steps:
      "150.high_freq": [0.000000000000000001, 150]
      "20.high_freq":  [0.000000000000000001,  20]

mysql:
  endpoint: "192.168.10.94:3306"
  user: "qihangxingchen"
  password: "Md3R3WJQGnJtCgfr"

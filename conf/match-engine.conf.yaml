app:
  profile: "market-match"
  name: "market-match" # ENV APP_NAME
  seq: 0  # ENV CAPTAIN_SEQ
  node: 1

rabbitmq:
  protocol: "amqp"
  address:
    - "10.0.1.18:5672"
  virtual-host: "/"
  username: "admin"
  password: "admin123"
  conn-num: 10
  conn-timeout-ms: 3000
  n-retry: 30
  ts-bumper-interval-ms: 3000
  exchange:
    market: "exchange.market-match.ts-bumper"
    trade-detail: "exchange.market-match.match-result"
    quotation: "l2quote"
  max-delay-s: 60
  compressed: false

batch_result: 90

snapshot:
  dir: "./sp/"
  ends-with: "-snapshot-go"
  n-history: 10
  min-gap: 100000

scheduler:
  snapshot: [0, 60000]  #15分钟
  orderbook-report: [0, 1500000]

redis:
  address:
    - "10.0.1.19:6001"
    - "10.0.1.19:6002"
    - "10.0.1.19:6003"
    - "10.0.1.19:6004"
    - "10.0.1.19:6005"
    - "10.0.1.19:6006"
  password: "123456"
  db: "0"
log:
  debug: false
  json-encode: false
  info-path: "./logs/info.log"
  error-path: "./logs/warn.log"
  max-age: 168
  Rotation: 1
  level: info # support trace debug info warn

exchange:
  l2quote:
    size: 1800
  trade:
    size: 5000
  depth:
    size: 1000

mrredis:
  check-result: true

symbols:
  - BTC_USDT
  - ETH_USDT



market:
  freq-depth-update-interval-ms: 30
  min-depth-update-interval-ms: 100
  min-stacked-depth-update-interval-ms: 1000
  default-update-interval-ms: 1000

symbol-info:
  default:
    amount-scale: 18
    price-scale: 18
    l2quote-price-scale: 2
    depth-10percent-capacity: 200
    depth-steps:
      "0": [0.000000000000000001, 150]
      "1": [0.00001, 150]
      "2": [0.0001, 150]
      "3": [0.001, 150]
      "4": [0.01, 150]
      "5": [0.1, 150]
      "6": [0.000000000000000001, 20]
      "7": [0.00001, 20]
      "8": [0.0001, 20]
      "9": [0.001, 20]
      "10": [0.01, 20]
      "11": [0.1, 20]
    uncombined-depth-steps:
      "150.high_freq": [0.000000000000000001, 150]
      "20.high_freq":  [0.000000000000000001,  20]

